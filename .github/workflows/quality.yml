name: Quality Gate

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Test, lint, and compile
        run: ./gradlew test lintDebug assembleDebug --stacktrace
      - name: Verify SonarQube Cloud quality gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          endpoint="https://sonarcloud.io/api/qualitygates/project_status?projectKey=StitchMl_ScoutEventi"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            endpoint="${endpoint}&pullRequest=${PR_NUMBER}"
          fi
          for attempt in {1..12}; do
            status="$(curl --fail --silent --show-error "$endpoint" | jq -r '.projectStatus.status')"
            if [[ "$status" == "OK" ]]; then
              exit 0
            fi
            if [[ "$status" == "ERROR" ]]; then
              echo "SonarQube Cloud Quality Gate failed"
              exit 1
            fi
            sleep 10
          done
          echo "SonarQube Cloud Quality Gate unavailable"
          exit 1
