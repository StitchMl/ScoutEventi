name: Build Release Artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_code: ${{ steps.version.outputs.version_code }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        name: Read and validate version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          version_code="$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$version"
          test -n "$version_code"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match app version v$version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"

  android:
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew test lint assembleRelease
      - name: Sign and verify APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          KEY_ALIAS="$(keytool -list -v -keystore "$RUNNER_TEMP/release.keystore" -storepass "$STORE_PASSWORD" | sed -n 's/^Alias name: //p' | head -n 1)"
          test -n "$KEY_ALIAS"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          mkdir -p build
          "$BUILD_TOOLS/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk "build/ScoutEventi-Android-v${VERSION}-aligned.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/release.keystore" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$STORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "build/ScoutEventi-Android-v${VERSION}.apk" \
            "build/ScoutEventi-Android-v${VERSION}-aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "build/ScoutEventi-Android-v${VERSION}.apk"
          sha256sum "build/ScoutEventi-Android-v${VERSION}.apk" > "build/ScoutEventi-Android-v${VERSION}.sha256"
          rm -f "build/ScoutEventi-Android-v${VERSION}-aligned.apk" "$RUNNER_TEMP/release.keystore"
      - uses: actions/upload-artifact@v6
        with:
          name: android-release
          if-no-files-found: error
          path: |
            build/ScoutEventi-Android-v${{ needs.metadata.outputs.version }}.apk
            build/ScoutEventi-Android-v${{ needs.metadata.outputs.version }}.sha256

  ios:
    needs: metadata
    runs-on: macos-15
    timeout-minutes: 40
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
      VERSION_CODE: ${{ needs.metadata.outputs.version_code }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Build unsigned iOS app
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          mkdir -p build
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ios-release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            MARKETING_VERSION="$VERSION" \
            APP_MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$VERSION_CODE" \
            APP_BUILD_NUMBER="$VERSION_CODE" \
            clean build | tee build/ios-release.log
      - name: Package and verify unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$(find build/ios-release/Build/Products -maxdepth 2 -type d -name '*.app' | head -n 1)"
          test -n "$APP_PATH"
          mkdir -p build/ios-package/Payload
          ditto "$APP_PATH" "build/ios-package/Payload/$(basename "$APP_PATH")"
          (cd build/ios-package && zip -qry "../ScoutEventi-iOS-unsigned-v${VERSION}.ipa" Payload)
          unzip -t "build/ScoutEventi-iOS-unsigned-v${VERSION}.ipa"
          shasum -a 256 "build/ScoutEventi-iOS-unsigned-v${VERSION}.ipa" > "build/ScoutEventi-iOS-unsigned-v${VERSION}.sha256"
      - uses: actions/upload-artifact@v6
        with:
          name: ios-release
          if-no-files-found: error
          path: |
            build/ScoutEventi-iOS-unsigned-v${{ needs.metadata.outputs.version }}.ipa
            build/ScoutEventi-iOS-unsigned-v${{ needs.metadata.outputs.version }}.sha256
            build/ios-release.log

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [metadata, android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: "*-release"
          path: build
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "v${VERSION}" \
            build/ScoutEventi-Android-v${VERSION}.apk \
            build/ScoutEventi-Android-v${VERSION}.sha256 \
            build/ScoutEventi-iOS-unsigned-v${VERSION}.ipa \
            build/ScoutEventi-iOS-unsigned-v${VERSION}.sha256 \
            --verify-tag \
            --generate-notes \
            --title "ScoutEventi v${VERSION}"
