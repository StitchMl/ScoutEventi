name: Build And Upload Unlisted iOS Release

on:
  workflow_dispatch:
    inputs:
      export_method:
        description: "Apple export method"
        required: true
        default: app-store
        type: choice
        options:
          - app-store
      upload_to_app_store_connect:
        description: "Upload the IPA to App Store Connect"
        required: true
        default: true
        type: boolean

jobs:
  unlisted-release:
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Validate signing secrets
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()

          for key in IOS_CERTIFICATE_P12_BASE64 IOS_PROVISIONING_PROFILE_BASE64; do
            if [ -z "${!key:-}" ]; then
              missing+=("$key")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing GitHub secrets: ${missing[*]}"
            exit 1
          fi

      - name: Validate App Store Connect secrets
        if: ${{ inputs.upload_to_app_store_connect == true || inputs.upload_to_app_store_connect == 'true' }}
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_PRIVATE_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_P8_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()

          for key in APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_API_ISSUER_ID APP_STORE_CONNECT_API_PRIVATE_KEY_P8_BASE64; do
            if [ -z "${!key:-}" ]; then
              missing+=("$key")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing GitHub secrets: ${missing[*]}"
            exit 1
          fi

      - name: Read Android version
        id: android_version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import pathlib
          import re

          text = pathlib.Path("app/build.gradle.kts").read_text(encoding="utf-8")
          version_code = re.search(r"versionCode\s*=\s*(\d+)", text)
          version_name = re.search(r'versionName\s*=\s*"([^"]+)"', text)

          if version_code is None or version_name is None:
              raise SystemExit("Unable to read versionCode/versionName from app/build.gradle.kts")

          print(f"build_number={version_code.group(1)}")
          print(f"marketing_version={version_name.group(1)}")
          PY

      - name: Install signing assets
        id: signing
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          IOS_APP_NAME: ${{ secrets.IOS_APP_NAME }}
        shell: bash
        run: |
          set -euo pipefail

          CERT_PATH="$RUNNER_TEMP/ios-signing-cert.p12"
          PROFILE_PATH="$RUNNER_TEMP/ios-profile.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/ios-profile.plist"
          KEYCHAIN_PATH="$RUNNER_TEMP/scouteventi-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"

          DEFAULT_BUNDLE_ID="$(awk -F= '/^BUNDLE_ID=/{print substr($0, index($0, "=") + 1)}' iosApp/Configuration/Config.xcconfig)"
          DEFAULT_APP_NAME="$(awk -F= '/^APP_NAME=/{print substr($0, index($0, "=") + 1)}' iosApp/Configuration/Config.xcconfig)"
          CERTIFICATE_PASSWORD="${IOS_CERTIFICATE_PASSWORD:-}"

          printf '%s' "$IOS_CERTIFICATE_P12_BASE64" | base64 -D > "$CERT_PATH"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -D > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"

          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print UUID' "$PROFILE_PLIST")"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print Name' "$PROFILE_PLIST")"
          PROFILE_TEAM_ID="$(/usr/libexec/PlistBuddy -c 'Print TeamIdentifier:0' "$PROFILE_PLIST")"
          APPLICATION_IDENTIFIER="$(/usr/libexec/PlistBuddy -c 'Print Entitlements:application-identifier' "$PROFILE_PLIST")"
          PROFILE_BUNDLE_ID="${APPLICATION_IDENTIFIER#${PROFILE_TEAM_ID}.}"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          SIGNING_IDENTITY="$(
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
              | sed -n 's/.*"\(.*\)"/\1/p' \
              | grep "^Apple Distribution" \
              | head -n 1
          )"

          if [ -z "$SIGNING_IDENTITY" ]; then
            echo "::error::No Apple Distribution identity found in the imported certificate."
            exit 1
          fi

          TEAM_ID="${IOS_TEAM_ID:-$PROFILE_TEAM_ID}"
          BUNDLE_ID="${IOS_BUNDLE_ID:-$DEFAULT_BUNDLE_ID}"
          APP_NAME="${IOS_APP_NAME:-$DEFAULT_APP_NAME}"

          if [ "$TEAM_ID" != "$PROFILE_TEAM_ID" ]; then
            echo "::error::IOS_TEAM_ID ($TEAM_ID) does not match the provisioning profile Team ID ($PROFILE_TEAM_ID)."
            exit 1
          fi

          if [ "$PROFILE_BUNDLE_ID" = "*" ]; then
            :
          elif [[ "$PROFILE_BUNDLE_ID" == *"*" ]]; then
            PROFILE_PREFIX="${PROFILE_BUNDLE_ID%\*}"
            if [[ "$BUNDLE_ID" != "$PROFILE_PREFIX"* ]]; then
              echo "::error::IOS_BUNDLE_ID ($BUNDLE_ID) is not covered by wildcard provisioning profile ($PROFILE_BUNDLE_ID)."
              exit 1
            fi
          elif [ "$BUNDLE_ID" != "$PROFILE_BUNDLE_ID" ]; then
            echo "::error::IOS_BUNDLE_ID ($BUNDLE_ID) does not match the provisioning profile bundle id ($PROFILE_BUNDLE_ID)."
            exit 1
          fi

          {
            echo "keychain_path=$KEYCHAIN_PATH"
            echo "profile_name=$PROFILE_NAME"
            echo "profile_uuid=$PROFILE_UUID"
            echo "team_id=$TEAM_ID"
            echo "bundle_id=$BUNDLE_ID"
            echo "app_name=$APP_NAME"
            echo "signing_identity=$SIGNING_IDENTITY"
          } >> "$GITHUB_OUTPUT"

      - name: Generate export options
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/ios
          cat > build/ios/export-options.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>compileBitcode</key>
              <false/>
              <key>destination</key>
              <string>export</string>
              <key>method</key>
              <string>app-store</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>${{ steps.signing.outputs.bundle_id }}</key>
                  <string>${{ steps.signing.outputs.profile_name }}</string>
              </dict>
              <key>signingStyle</key>
              <string>manual</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>teamID</key>
              <string>${{ steps.signing.outputs.team_id }}</string>
              <key>uploadBitcode</key>
              <false/>
              <key>uploadSymbols</key>
              <true/>
          </dict>
          </plist>
          EOF

      - name: Archive iOS app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/ios
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -archivePath build/ios/ScoutEventi.xcarchive \
            -destination "generic/platform=iOS" \
            OTHER_CODE_SIGN_FLAGS="--keychain ${{ steps.signing.outputs.keychain_path }}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="${{ steps.signing.outputs.signing_identity }}" \
            PROVISIONING_PROFILE_SPECIFIER="${{ steps.signing.outputs.profile_name }}" \
            DEVELOPMENT_TEAM="${{ steps.signing.outputs.team_id }}" \
            TEAM_ID="${{ steps.signing.outputs.team_id }}" \
            PRODUCT_BUNDLE_IDENTIFIER="${{ steps.signing.outputs.bundle_id }}" \
            BUNDLE_ID="${{ steps.signing.outputs.bundle_id }}" \
            PRODUCT_NAME="${{ steps.signing.outputs.app_name }}" \
            APP_NAME="${{ steps.signing.outputs.app_name }}" \
            MARKETING_VERSION="${{ steps.android_version.outputs.marketing_version }}" \
            APP_MARKETING_VERSION="${{ steps.android_version.outputs.marketing_version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.android_version.outputs.build_number }}" \
            APP_BUILD_NUMBER="${{ steps.android_version.outputs.build_number }}" \
            clean archive | tee build/ios/archive.log

      - name: Export IPA
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -exportArchive \
            -archivePath build/ios/ScoutEventi.xcarchive \
            -exportPath build/ios/export \
            -exportOptionsPlist build/ios/export-options.plist \
            OTHER_CODE_SIGN_FLAGS="--keychain ${{ steps.signing.outputs.keychain_path }}" \
            | tee build/ios/export.log

      - name: Collect IPA artifact
        id: ipa
        shell: bash
        run: |
          set -euo pipefail
          IPA_PATH="$(find build/ios/export -maxdepth 1 -type f -name '*.ipa' | head -n 1)"

          if [ -z "$IPA_PATH" ]; then
            echo "::error::No .ipa file was generated."
            exit 1
          fi

          FINAL_IPA="build/ios/ScoutEventi-unlisted.ipa"
          cp "$IPA_PATH" "$FINAL_IPA"

          {
            echo "ipa_path=$FINAL_IPA"
            echo "ipa_name=$(basename "$FINAL_IPA")"
          } >> "$GITHUB_OUTPUT"

      - name: Install App Store Connect API key
        if: ${{ inputs.upload_to_app_store_connect == true || inputs.upload_to_app_store_connect == 'true' }}
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_PRIVATE_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_P8_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$APP_STORE_CONNECT_API_PRIVATE_KEY_P8_BASE64" | base64 -D > "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"

      - name: Upload build to App Store Connect
        if: ${{ inputs.upload_to_app_store_connect == true || inputs.upload_to_app_store_connect == 'true' }}
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          xcrun iTMSTransporter \
            -m upload \
            -assetFile "${{ steps.ipa.outputs.ipa_path }}" \
            -apiKey "${APP_STORE_CONNECT_API_KEY_ID}" \
            -apiIssuer "${APP_STORE_CONNECT_API_ISSUER_ID}" \
            -distribution AppStore \
            -v eXtreme | tee build/ios/app-store-connect-upload.log

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ios-unlisted-release
          if-no-files-found: error
          path: |
            ${{ steps.ipa.outputs.ipa_path }}
            build/ios/archive.log
            build/ios/export.log
            build/ios/export-options.plist
            build/ios/app-store-connect-upload.log

      - name: Publish release summary
        shell: bash
        run: |
          {
            echo "## Unlisted iOS release prepared"
            echo
            echo "- Artifact: \`${{ steps.ipa.outputs.ipa_name }}\`"
            echo "- Uploaded to App Store Connect: \`${{ inputs.upload_to_app_store_connect }}\`"
            echo "- Bundle ID: \`${{ steps.signing.outputs.bundle_id }}\`"
            echo "- Team ID: \`${{ steps.signing.outputs.team_id }}\`"
            echo "- Version: \`${{ steps.android_version.outputs.marketing_version }} (${{ steps.android_version.outputs.build_number }})\`"
            echo
            echo "Next Apple-side steps:"
            echo "1. Complete metadata and screenshots in App Store Connect."
            echo "2. In Review Notes, state that the app is intended for unlisted distribution."
            echo "3. Submit the version to App Review."
            echo "4. After submission or approval, request unlisted distribution from Apple."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up secrets and temp files
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/${{ steps.signing.outputs.profile_uuid }}.mobileprovision" || true
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8" || true
          security delete-keychain "${{ steps.signing.outputs.keychain_path }}" || true
